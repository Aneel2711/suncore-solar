<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#sky)"/>
  <!-- Sun & Rays -->
  <circle cx="650" cy="115" r="52" fill="url(#sun)" opacity="0.18"/>
  <circle cx="650" cy="115" r="34" fill="#10b981" opacity="0.85"/>
  <!-- Background Tree Silhouettes -->
  <g fill="#a7f3d0" opacity="0.55">
    <circle cx="110" cy="390" r="65"/>
    <circle cx="165" cy="405" r="50"/>
    <circle cx="70" cy="415" r="45"/>
    <circle cx="690" cy="385" r="70"/>
    <circle cx="635" cy="405" r="52"/>
  </g>
  <!-- Foreground Trees Left -->
  <rect x="122" y="425" width="12" height="65" rx="4" fill="#065f46"/>
  <circle cx="128" cy="395" r="46" fill="#059669"/>
  <circle cx="102" cy="412" r="32" fill="#10b981"/>
  <circle cx="154" cy="412" r="32" fill="#047857"/>
  <!-- Foreground Trees Right -->
  <rect x="668" y="420" width="14" height="70" rx="4" fill="#065f46"/>
  <circle cx="675" cy="385" r="50" fill="#059669"/>
  <circle cx="645" cy="405" r="35" fill="#10b981"/>
  <circle cx="705" cy="405" r="34" fill="#047857"/>
  <!-- Modern Eco House -->
  <polygon points="220,320 400,200 580,320" fill="#064e3b"/>
  <rect x="245" y="320" width="310" height="170" rx="6" fill="#ffffff" stroke="#d1fae5" stroke-width="3"/>
  <!-- Solar Array on Roof -->
  <g transform="translate(290,235)">
    <polygon points="25,65 110,12 205,12 120,65" fill="url(#panel)" stroke="#ecfdf5" stroke-width="2.5"/>
    <line x1="68" y1="38" x2="162" y2="38" stroke="#6ee7b7" stroke-width="1.5"/>
    <line x1="68" y1="12" x2="68" y2="65" stroke="#6ee7b7" stroke-width="1.5" opacity="0.6"/>
    <line x1="115" y1="12" x2="115" y2="65" stroke="#6ee7b7" stroke-width="1.5" opacity="0.6"/>
    <line x1="160" y1="12" x2="160" y2="65" stroke="#6ee7b7" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- Windows & Door -->
  <rect x="280" y="355" width="75" height="65" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="445" y="355" width="75" height="65" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="378" y="395" width="44" height="95" rx="4" fill="#059669"/>
  <!-- Ground Line -->
  <rect x="0" y="490" width="800" height="70" fill="#ecfdf5"/>
  <line x1="40" y1="490" x2="760" y2="490" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
</svg>